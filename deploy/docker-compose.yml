# Alephat self-hosted Temporal (v1.32+) + DeepAgents multi-service stack.
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build -d --remove-orphans
#
# UI:          http://localhost:3005
# API:         http://localhost:8080
# Webhook:     http://localhost:8081
# Temporal UI: http://localhost:8233

name: ${COMPOSE_PROJECT_NAME:-alephat}

x-runtime: &runtime
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alephat:alephat@postgres:5432/alephat}
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-alephat-agents}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-openai:gpt-4o-mini}
  DEFAULT_SANDBOX_PROVIDER: ${DEFAULT_SANDBOX_PROVIDER:-local}
  DEFAULT_ORG_ID: ${DEFAULT_ORG_ID:-00000000-0000-4000-8000-000000000001}
  DEFAULT_USER_ID: ${DEFAULT_USER_ID:-00000000-0000-4000-8000-000000000002}
  ALLOWED_GITHUB_USERS: ${ALLOWED_GITHUB_USERS:-}
  ALLOWED_GITHUB_ORGS: ${ALLOWED_GITHUB_ORGS:-}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alephat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alephat}
      POSTGRES_DB: ${POSTGRES_DB:-alephat}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - alephat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alephat} -d ${POSTGRES_DB:-alephat}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.32.2}
    restart: "no"
    environment:
      POSTGRES_SEEDS: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-alephat}
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-alephat}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -u "$$POSTGRES_USER" -p "$$DB_PORT" --db temporal create || true
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -u "$$POSTGRES_USER" -p "$$DB_PORT" --db temporal setup-schema -v 0.0 || true
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -u "$$POSTGRES_USER" -p "$$DB_PORT" --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -u "$$POSTGRES_USER" -p "$$DB_PORT" --db temporal_visibility create || true
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -u "$$POSTGRES_USER" -p "$$DB_PORT" --db temporal_visibility setup-schema -v 0.0 || true
        temporal-sql-tool --plugin postgres12 --ep "$$POSTGRES_SEEDS" -u "$$POSTGRES_USER" -p "$$DB_PORT" --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.32.2}
    restart: unless-stopped
    environment:
      BIND_ON_IP: 0.0.0.0
      POSTGRES_SEEDS: postgres
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-alephat}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-alephat}
    volumes:
      - ./temporal-config.yaml:/etc/temporal/config.template.yaml:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        BROADCAST_IP="$$(getent hosts "$$(hostname)" | awk '{print $$1}')"
        sed -e "s|__POSTGRES_SEEDS__|$$POSTGRES_SEEDS|g" \
            -e "s|__DB_PORT__|$$DB_PORT|g" \
            -e "s|__POSTGRES_USER__|$$POSTGRES_USER|g" \
            -e "s|__POSTGRES_PWD__|$$POSTGRES_PWD|g" \
            -e "s|__BIND_ON_IP__|$$BIND_ON_IP|g" \
            -e "s|__TEMPORAL_BROADCAST_ADDRESS__|$$BROADCAST_IP|g" \
            /etc/temporal/config.template.yaml > /tmp/temporal-config.yaml
        exec temporal-server --allow-no-auth --config-file /tmp/temporal-config.yaml start
    ports:
      - "${TEMPORAL_HOST_PORT:-7233}:7233"
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.32.2}
    restart: "no"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until temporal operator cluster health --address "$$TEMPORAL_ADDRESS" >/dev/null 2>&1; do sleep 1; done
        temporal operator namespace describe -n "$$TEMPORAL_NAMESPACE" --address "$$TEMPORAL_ADDRESS" >/dev/null 2>&1 \
          || temporal operator namespace create -n "$$TEMPORAL_NAMESPACE" --address "$$TEMPORAL_ADDRESS"
    depends_on:
      temporal:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-latest}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:3005
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_HOST_PORT:-4000}:4000"
    profiles: ["with-litellm"]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: alephat-platform:local
    restart: "no"
    environment:
      <<: *runtime
      BOOTSTRAP_DEV_DEFAULTS: "true"
    command: ["python", "-m", "alephat_platform.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: alephat-platform:local
    restart: unless-stopped
    environment:
      <<: *runtime
      SERVICE_NAME: api
      API_AUTH_DISABLED: ${API_AUTH_DISABLED:-true}
      PLATFORM_API_TOKEN: ${PLATFORM_API_TOKEN:-}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      MCP_STDIO_ALLOWED: ${MCP_STDIO_ALLOWED:-false}
      MCP_ALLOW_PRIVATE_NETWORKS: ${MCP_ALLOW_PRIVATE_NETWORKS:-false}
      MCP_TOOL_TIMEOUT_SECONDS: ${MCP_TOOL_TIMEOUT_SECONDS:-120}
      MAX_MCP_SERVERS_PER_RUN: ${MAX_MCP_SERVERS_PER_RUN:-10}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    command: ["uvicorn", "alephat_platform.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  webhook:
    image: alephat-platform:local
    restart: unless-stopped
    environment:
      <<: *runtime
      SERVICE_NAME: webhook
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      SLACK_USER_MAP: ${SLACK_USER_MAP:-}
      WEBHOOK_SIGNATURES_REQUIRED: ${WEBHOOK_SIGNATURES_REQUIRED:-false}
    command: ["uvicorn", "alephat_platform.webhook.app:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "${WEBHOOK_HOST_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  harness:
    image: alephat-platform:local
    restart: unless-stopped
    environment:
      <<: *runtime
      SERVICE_NAME: harness
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_RENDERER_URL: http://slack-renderer:8082
      SLACK_RENDERER_TOKEN: ${SLACK_RENDERER_TOKEN:-}
      WORKER_ID: ${WORKER_ID:-harness-1}
      LLM_MODE: ${LLM_MODE:-auto}
      LITELLM_ENABLED: ${LITELLM_ENABLED:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-litellm}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_BASE_URL: ${FIREWORKS_BASE_URL:-https://api.fireworks.ai/inference/v1}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      MAX_RUN_DURATION_SECONDS: ${MAX_RUN_DURATION_SECONDS:-14400}
      MAX_RUN_RETRIES: ${MAX_RUN_RETRIES:-3}
      LOCAL_SANDBOX_ROOT_DIR: ${LOCAL_SANDBOX_ROOT_DIR:-/workspace}
      ALLOW_STUB_SANDBOXES: ${ALLOW_STUB_SANDBOXES:-true}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      AGENT_SANDBOX_KUBECONFIG: ${AGENT_SANDBOX_KUBECONFIG:-}
      AGENT_SANDBOX_NAMESPACE: ${AGENT_SANDBOX_NAMESPACE:-agent-sandboxes}
      OPENSANDBOX_BASE_URL: ${OPENSANDBOX_BASE_URL:-}
      OPENSANDBOX_API_KEY: ${OPENSANDBOX_API_KEY:-}
      MCP_STDIO_ALLOWED: ${MCP_STDIO_ALLOWED:-false}
      MCP_ALLOW_PRIVATE_NETWORKS: ${MCP_ALLOW_PRIVATE_NETWORKS:-false}
      MCP_TOOL_TIMEOUT_SECONDS: ${MCP_TOOL_TIMEOUT_SECONDS:-120}
    command: ["python", "-m", "alephat_platform.harness.worker"]
    volumes:
      - alephat_workspaces:/workspace
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
      slack-renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  slack-renderer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.slack-renderer
    image: alephat-slack-renderer:local
    restart: unless-stopped
    environment:
      SLACK_RENDERER_TOKEN: ${SLACK_RENDERER_TOKEN:-}
    ports:
      - "127.0.0.1:${SLACK_RENDERER_HOST_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    image: alephat-ui:local
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8080
      NGINX_ENVSUBST_FILTER: API_UPSTREAM
    ports:
      - "${UI_HOST_PORT:-3005}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  alephat_pg:
  alephat_workspaces:
