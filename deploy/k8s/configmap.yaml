apiVersion: v1
kind: ConfigMap
metadata:
  name: alephat-config
  namespace: alephat
data:
  DATABASE_URL: ""
  DATABASE_HOST: "alephat-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "alephat"
  DATABASE_USER: "alephat"
  TEMPORAL_ADDRESS: "temporal.alephat.svc.cluster.local:7233"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TASK_QUEUE: "alephat-agents"
  TEMPORAL_TLS: "true"
  TEMPORAL_TLS_CA_CERT_PATH: "/etc/temporal/tls/ca.crt"
  TEMPORAL_TLS_CLIENT_CERT_PATH: "/etc/temporal/tls/tls.crt"
  TEMPORAL_TLS_CLIENT_KEY_PATH: "/etc/temporal/tls/tls.key"
  TEMPORAL_TLS_SERVER_NAME: "temporal.alephat.svc.cluster.local"
  LLM_MODE: "litellm"
  LITELLM_ENABLED: "true"
  LITELLM_BASE_URL: "http://alephat-platform-litellm:4000"
  LITELLM_API_KEY: "sk-litellm"
  DEFAULT_MODEL: "google:gemini-4-argon"
  DEFAULT_SANDBOX_PROVIDER: "agent_sandbox"
  BOOTSTRAP_DEV_DEFAULTS: "true"
  AGENT_SANDBOX_NAMESPACE: "alephat-sandboxes"
  AGENT_SANDBOX_TEMPLATE: "python-runtime-template"
  API_AUTH_DISABLED: "false"
  WEBHOOK_SIGNATURES_REQUIRED: "true"
  DASHBOARD_BASE_URL: "http://127.0.0.1:18080"
  DASHBOARD_API_BASE_URL: "http://127.0.0.1:18080"
  DASHBOARD_ALLOWED_ORIGINS: "http://127.0.0.1:18080"
  CORS_ORIGINS: "http://127.0.0.1:18080"
  MAX_RUN_RETRIES: "3"
  ALLOW_STUB_SANDBOXES: "false"
