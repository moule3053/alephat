# Scales Temporal DeepAgents workers from the alephat-agents Task Queue backlog via KEDA's native temporal scaler.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: alephat-harness
  namespace: alephat
spec:
  scaleTargetRef:
    name: alephat-harness
  minReplicaCount: 2
  maxReplicaCount: 50
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: temporal
      metadata:
        endpoint: temporal.alephat.svc:7233
        namespace: default
        taskQueue: alephat-agents
        targetQueueSize: "4"
        unsafeSsl: "true"
