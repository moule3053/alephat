apiVersion: v1
kind: ServiceAccount
metadata:
  name: alephat-eso
  namespace: alephat
  annotations:
    iam.gke.io/gcp-service-account: alephat-eso@your-gcp-project-id.iam.gserviceaccount.com
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: alephat
spec:
  provider:
    gcpsm:
      projectID: your-gcp-project-id
      auth:
        workloadIdentity:
          clusterLocation: us-central1-a
          clusterName: alephat
          clusterProjectID: your-gcp-project-id
          serviceAccountRef:
            name: alephat-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alephat-oauth
  namespace: alephat
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: alephat-oauth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: alephat-oauth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alephat-secrets
  namespace: alephat
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: alephat-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: alephat-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alephat-postgres
  namespace: alephat
