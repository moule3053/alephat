apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alephat
  namespace: alephat
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`alephat.example.com`) && PathPrefix(`/hooks/`)
      priority: 100
      services:
        - name: alephat-webhook
          port: 80
    - kind: Rule
      match: Host(`alephat.example.com`)
      priority: 10
      services:
        - name: alephat-ui
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: temporal-grpc-mtls
  namespace: alephat
spec:
  minVersion: VersionTLS12
  sniStrict: true
  alpnProtocols:
    - h2
    - acme-tls/1
  clientAuth:
    secretNames:
      - temporal-tls
    clientAuthType: RequireAndVerifyClientCert
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: temporal-grpc-backend
  namespace: alephat
spec:
  serverName: temporal.alephat.svc.cluster.local
  rootCAs:
    - secret: temporal-tls
  certificatesSecrets:
    - temporal-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: temporal-grpc
  namespace: alephat
spec:
  entryPoints:
    - websecure
    - temporal
  routes:
    - kind: Rule
      match: Host(`temporal-grpc.example.com`)
      services:
        - name: temporal
          port: 7233
          scheme: https
          serversTransport: temporal-grpc-backend
  tls:
    certResolver: letsencrypt
    options:
      name: temporal-grpc-mtls
      namespace: alephat
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: temporal-ui-basicauth
  namespace: alephat
spec:
  basicAuth:
    secret: temporal-ui-auth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: temporal-ui
  namespace: alephat
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`temporal.example.com`)
      middlewares:
        - name: temporal-ui-basicauth
          namespace: alephat
      services:
        - name: temporal-ui
          port: 8080
  tls:
    certResolver: letsencrypt
