fullnameOverride: alephat-platform-litellm

replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm-database
  tag: v1.106.6
  pullPolicy: IfNotPresent

masterkeySecretName: litellm-secrets
masterkeySecretKey: masterkey

environmentSecrets:
  - litellm-provider-keys

proxy_config:
  model_list:
    - model_name: google:gemini-4-hydrogen
      litellm_params:
        model: gemini/gemini-4-hydrogen
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-4-carbon
      litellm_params:
        model: gemini/gemini-4-carbon
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-4-argon
      litellm_params:
        model: gemini/gemini-4-argon
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-3.8-flash
      litellm_params:
        model: gemini/gemini-3.8-flash
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-3.5-flash
      litellm_params:
        model: gemini/gemini-3.5-flash
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-3.1-pro-preview
      litellm_params:
        model: gemini/gemini-3.1-pro-preview
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-2.5-pro
      litellm_params:
        model: gemini/gemini-2.5-pro
        api_key: os.environ/GEMINI_API_KEY
    - model_name: google:gemini-2.5-flash
      litellm_params:
        model: gemini/gemini-2.5-flash
        api_key: os.environ/GEMINI_API_KEY
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY
  litellm_settings:
    drop_params: true

db:
  useExisting: false
  deployStandalone: true

postgresql:
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/postgresql
  auth:
    username: litellm
    database: litellm
    existingSecret: litellm-postgres
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      storageClass: standard-rwo
      size: 20Gi

redis:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi
