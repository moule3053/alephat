{{- if .Values.temporal.enabled }}
{{- $tNs := .Values.namespaces.temporal -}}
{{- $tHost := include "alephat.temporalHost" . -}}
{{- $tAddr := include "alephat.temporalAddress" . -}}
{{- $pgHost := include "alephat.postgresHost" . -}}
{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alephat-postgres
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: alephat-postgres
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: alephat-postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-tls
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: temporal-tls
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: temporal-tls
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-ui-auth
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: temporal-ui-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: temporal-ui-auth
{{- else }}
{{- include "alephat.generatedSecrets" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alephat-postgres
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ index ._generatedSecrets "postgresPassword" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-tls
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ index ._generatedSecrets "caCrt" | quote }}
  server.crt: {{ index ._generatedSecrets "serverCrt" | quote }}
  server.key: {{ index ._generatedSecrets "serverKey" | quote }}
  tls.crt: {{ index ._generatedSecrets "clientCrt" | quote }}
  tls.key: {{ index ._generatedSecrets "clientKey" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-grpc-tls
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData:
  tls.crt: {{ index ._generatedSecrets "serverCrt" | quote }}
  tls.key: {{ index ._generatedSecrets "serverKey" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-ui-auth
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
type: Opaque
stringData:
  users: {{ default (htpasswd "admin" (randAlphaNum 20)) .Values.secrets.temporalUiUsers | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-server-config
  namespace: {{ $tNs }}
  labels:
    {{- include "alephat.labels" . | nindent 4 }}
data:
  config.template.yaml: |
    log:
      stdout: true
      level: info
    persistence:
      numHistoryShards: {{ .Values.temporal.numHistoryShards }}
      defaultStore: default
      visibilityStore: visibility
      datastores:
        default:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal"
            connectAddr: "__POSTGRES_SEEDS__:__DB_PORT__"
            connectProtocol: "tcp"
            user: "__POSTGRES_USER__"
            password: "__POSTGRES_PWD__"
            maxConns: 20
            maxIdleConns: 20
            maxConnLifetime: 1h
        visibility:
          sql:
            pluginName: "postgres12"
            databaseName: "temporal_visibility"
            connectAddr: "__POSTGRES_SEEDS__:__DB_PORT__"
            connectProtocol: "tcp"
            user: "__POSTGRES_USER__"
            password: "__POSTGRES_PWD__"
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: 1h
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "__TEMPORAL_BROADCAST_ADDRESS__"
      tls:
        internode:
          server:
            certFile: /etc/temporal/tls/server.crt
            keyFile: /etc/temporal/tls/server.key
            requireClientAuth: true
            clientCaFiles:
              - /etc/temporal/tls/ca.crt
          client:
            serverName: {{ $tHost }}
            rootCaFiles:
              - /etc/temporal/tls/ca.crt
        frontend:
          server:
            certFile: /etc/temporal/tls/server.crt
            keyFile: /etc/temporal/tls/server.key
            requireClientAuth: true
            clientCaFiles:
              - /etc/temporal/tls/ca.crt
          client:
            serverName: {{ $tHost }}
            rootCaFiles:
              - /etc/temporal/tls/ca.crt
    services:
      frontend:
        rpc:
          grpcPort: 7233
          membershipPort: 6933
          bindOnIP: "__BIND_ON_IP__"
          httpPort: 7243
      matching:
        rpc:
          grpcPort: 7235
          membershipPort: 6935
          bindOnIP: "__BIND_ON_IP__"
      history:
        rpc:
          grpcPort: 7234
          membershipPort: 6934
          bindOnIP: "__BIND_ON_IP__"
      worker:
        rpc:
          grpcPort: 7239
          membershipPort: 6939
          bindOnIP: "__BIND_ON_IP__"
    clusterMetadata:
      enableGlobalNamespace: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: "frontend"
          rpcAddress: "__TEMPORAL_BROADCAST_ADDRESS__:7233"
          httpAddress: "__TEMPORAL_BROADCAST_ADDRESS__:7243"
    dcRedirectionPolicy:
      policy: "noop"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: {{ $tNs }}
  labels:
    app: temporal
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.temporal.numHistoryShards | toString | sha256sum }}
      labels:
        app: temporal
    spec:
      initContainers:
        - name: temporal-schema
          image: {{ .Values.temporal.adminToolsImage }}
          env:
            - name: POSTGRES_SEEDS
              value: {{ $pgHost | quote }}
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z "$POSTGRES_SEEDS" "$DB_PORT" >/dev/null 2>&1; do sleep 2; done
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal create || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal setup-schema -v 0.0 || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal_visibility create || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal_visibility setup-schema -v 0.0 || true
              temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -u "$POSTGRES_USER" -p "$DB_PORT" --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
      containers:
        - name: temporal
          image: {{ .Values.temporal.serverImage }}
          ports:
            - name: grpc
              containerPort: 7233
          env:
            - name: BIND_ON_IP
              value: "0.0.0.0"
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: POSTGRES_SEEDS
              value: {{ $pgHost | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              BROADCAST_IP="$(getent hosts "$(hostname)" | awk '{print $1}')"
              sed -e "s|__POSTGRES_SEEDS__|$POSTGRES_SEEDS|g" \
                  -e "s|__DB_PORT__|$DB_PORT|g" \
                  -e "s|__POSTGRES_USER__|$POSTGRES_USER|g" \
                  -e "s|__POSTGRES_PWD__|$POSTGRES_PWD|g" \
                  -e "s|__BIND_ON_IP__|$BIND_ON_IP|g" \
                  -e "s|__TEMPORAL_BROADCAST_ADDRESS__|$BROADCAST_IP|g" \
                  /etc/temporal/config/config.template.yaml > /tmp/temporal-config.yaml
              exec temporal-server --allow-no-auth --config-file /tmp/temporal-config.yaml start
          volumeMounts:
            - name: config
              mountPath: /etc/temporal/config
              readOnly: true
            - name: tls
              mountPath: /etc/temporal/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.temporal.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: temporal-server-config
        - name: tls
          secret:
            secretName: temporal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: {{ $tNs }}
  labels:
    app: temporal
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-namespace
  namespace: {{ $tNs }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app: temporal-namespace
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: temporal-namespace
    spec:
      restartPolicy: OnFailure
      containers:
        - name: namespace-setup
          image: {{ .Values.temporal.adminToolsImage }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ $tAddr | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TLS
              value: "true"
            - name: TEMPORAL_TLS_SERVER_CA_CERT_PATH
              value: /etc/temporal/tls/ca.crt
            - name: TEMPORAL_TLS_CLIENT_CERT_PATH
              value: /etc/temporal/tls/tls.crt
            - name: TEMPORAL_TLS_CLIENT_KEY_PATH
              value: /etc/temporal/tls/tls.key
            - name: TEMPORAL_TLS_SERVER_NAME
              value: {{ $tHost | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              until temporal operator cluster health >/dev/null 2>&1; do sleep 2; done
              temporal operator namespace describe -n "$TEMPORAL_NAMESPACE" >/dev/null 2>&1 \
                || temporal operator namespace create -n "$TEMPORAL_NAMESPACE"
          volumeMounts:
            - name: tls
              mountPath: /etc/temporal/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: temporal-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: {{ $tNs }}
  labels:
    app: temporal-ui
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui
  template:
    metadata:
      labels:
        app: temporal-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: {{ .Values.temporal.uiImage }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ $tAddr | quote }}
            - name: TEMPORAL_TLS_CA
              value: /etc/temporal/tls/ca.crt
            - name: TEMPORAL_TLS_CERT
              value: /etc/temporal/tls/tls.crt
            - name: TEMPORAL_TLS_KEY
              value: /etc/temporal/tls/tls.key
            - name: TEMPORAL_TLS_SERVER_NAME
              value: {{ $tHost | quote }}
            - name: TEMPORAL_TLS_ENABLE_HOST_VERIFICATION
              value: "true"
          volumeMounts:
            - name: tls
              mountPath: /etc/temporal/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.temporal.uiResources | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: temporal-tls
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: {{ $tNs }}
  labels:
    app: temporal-ui
    {{- include "alephat.labels" . | nindent 4 }}
spec:
  selector:
    app: temporal-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
