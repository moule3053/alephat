# LiteLLM coding models configuration for local docker-compose (`--profile with-litellm`).
# Set GEMINI_API_KEY (or GOOGLE_API_KEY), ANTHROPIC_API_KEY, and/or OPENAI_API_KEY in deploy/.env.
model_list:
  - model_name: google:gemini-4-hydrogen
    litellm_params:
      model: gemini/gemini-4-hydrogen
      api_key: os.environ/GEMINI_API_KEY
  - model_name: google:gemini-4-carbon
    litellm_params:
      model: gemini/gemini-4-carbon
      api_key: os.environ/GEMINI_API_KEY
