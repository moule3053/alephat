steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile.slack-renderer", "-t", "${_SLACK_RENDERER_IMAGE}", "."]
images:
  - "${_SLACK_RENDERER_IMAGE}"
substitutions:
  _SLACK_RENDERER_IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/alephat/alephat-slack-renderer:latest
